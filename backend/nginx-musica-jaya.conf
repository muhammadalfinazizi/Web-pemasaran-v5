server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain Anda kalau ada, atau biarkan "_" untuk akses lewat IP saja
    server_name _;

    # Folder tempat file frontend (Web Pemasaran Update V2) disalin di server
    root /var/www/musica-jaya;
    index index.html;

    # Header keamanan dasar
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # ── Frontend statis (HTML, CSS, JS, gambar) ──
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache aset statis supaya lebih cepat
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # ── Backend API (Flask lewat gunicorn di port 5000) ──
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Foto produk yang diupload admin (disajikan LANGSUNG oleh Nginx dari disk,
    #     tidak lewat Flask, supaya lebih cepat & tidak mudah gagal) ──
    location /uploads/ {
        alias __UPLOADS_DIR__/;
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    client_max_body_size 10M;
}
